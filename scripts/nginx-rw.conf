# Roni Workbench nginx 反代模板（PROD）
# 复制到 /etc/nginx/conf.d/rw.conf，修改 server_name 与证书路径

server {
    listen 443 ssl http2;
    server_name agent.yourdomain.com;   # ← 改成你的域名

    ssl_certificate     /etc/nginx/ssl/agent.pem;
    ssl_certificate_key /etc/nginx/ssl/agent.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # SSE 流式：关闭缓冲
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 飞书回调（无需登录）
    location /api/feishu/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name agent.yourdomain.com;
    return 301 https://$host$request_uri;
}
